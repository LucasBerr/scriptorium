# Starter term base for EN -> PT-BR.
#
# `forbidden_variants` is what makes compliance checkable: without a variant to
# rule out, "did it use a synonym?" has no mechanical answer.
#
# `acceptable_variants` are the forms that also pass the check. They exist so
# consistency can be a stricter requirement than compliance: both "e-mail" and
# "email" are correct Brazilian Portuguese, and a term base that forbade one
# would be failing a correct translation — but a single document that uses both
# is sloppy, and that is what the rendering ledger catches.
#
# Terms are mined from the document and proposed here for human approval. No
# entry arrives in this file without a person putting it there.

- source_term: button
  target_term: botão
  forbidden_variants: [botao, tecla]
- source_term: folder
  target_term: pasta
  forbidden_variants: [diretório, pastinha]
- source_term: file
  target_term: arquivo
  forbidden_variants: [ficheiro]
- source_term: library
  target_term: biblioteca
  forbidden_variants: [livraria]
  notes: "False friend: 'livraria' is a bookshop."
- source_term: driver
  target_term: driver
  do_not_translate: true
  notes: "Software sense. A person who drives is 'motorista' and is a different term."
- source_term: database
  target_term: banco de dados
  forbidden_variants: [base de dados]
- source_term: settings
  target_term: configurações
  forbidden_variants: [ajustes, definições]
- source_term: SAP Translation Hub
  target_term: SAP Translation Hub
  do_not_translate: true
  case_sensitive: true
- source_term: email
  target_term: e-mail
  acceptable_variants: [email]
  forbidden_variants: [correio eletrônico]
  notes: "Both hyphenations are correct; the document must pick one and keep it."
- source_term: sign in
  target_term: entrar
  acceptable_variants: [fazer login]
  forbidden_variants: [iniciar sessão, logar]
  notes: "'iniciar sessão' is European Portuguese; 'logar' is too informal for docs."
